<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин за хранителни стоки</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1, h2 {
            text-align: center;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .container {
            margin: 0 auto;
            width: 80%;
        }
        #xmlDataContainer {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<h1>Магазин за хранителни стоки</h1>
<div class="container">
    <div id="xmlDataContainer"></div>
</div>
</body>
</html>
